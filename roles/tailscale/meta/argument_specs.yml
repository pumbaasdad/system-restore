---
argument_specs:
  main:
    short_description: Install and configure Tailscale
    description:
      - Installs Tailscale package repository and client
      - Ensures the tailscaled service is enabled and started
      - Authenticates and connects to the Tailscale network using an auth key
      - Configures Tailscale DNS settings
    author: Pumbaa's Dad
    options:
      tailscale_accept_dns:
        type: bool
        required: false
        default: false
        description: Whether to accept DNS configuration provided by the Tailscale network.
      tailscale_auth_key:
        type: str
        required: true
        description: Authentication key used to authenticate and connect the machine to Tailscale.
