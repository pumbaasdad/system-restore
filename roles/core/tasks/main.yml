- include_vars:
    file: "packages/{{ ansible_facts['distribution'] | lower }}.yml"

- include_tasks:
    file: "{{ ansible_facts['distribution'] | lower }}.yml"

- vars:
    package_config: "{{ core_fish_packages }}"
  include_role:
    name: package

- become: true
  block:
    - name: Set vim as default editor
      become: true
      alternatives:
        name: editor
        path: /usr/bin/vim.basic

    - name: Set fish as default shell
      become: true
      user:
        name: "{{ core_user }}"
        shell: /usr/bin/fish

- name: Install fish configuration files
  copy:
    src: fish/
    dest: "{{ ansible_facts['env'].HOME }}/.config/fish"

- name: Create htop configuration directory
  file:
    dest: "{{ ansible_facts['env'].HOME }}/.config/htop"
    state: directory

- name: Initialize htop configuration
  copy:
    src: htoprc
    dest: "{{ ansible_facts['env'].HOME }}/.config/htop/htoprc"
    force: false