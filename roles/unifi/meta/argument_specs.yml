---
argument_specs:
  main:
    short_description: Install and configure UniFi Network Controller
    description:
      - Creates dedicated unifi user and group for the service
      - Installs UniFi Network Controller from Ubiquiti repository
      - Configures APT repository with proper GPG key verification
      - Sets up specific UniFi package versions for consistent deployments
    author: Pumbaa's Dad
    options:
      unifi_apt_cache_valid_time:
        type: int
        required: true
        description: The amount of time since the last apt cache update that this role should wait before updating the apt cache again.
      unifi_installer_directory:
        type: str
        required: true
        description: The directory where the unifi OS server installer will be saved