- name: Configure apt sources
  deb822_repository:
    name: "{{ item.name }}"
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components }}"
    enabled: "{{ item.enabled }}"
  loop:
    - name: debian
      uris: http://deb.debian.org/debian
      suites:
        - "{{ ansible_facts['distribution_release'] }}"
        - "{{ ansible_facts['distribution_release'] }}-updates"
      components:
        - main
        - contrib
      enabled: true
    - name: debian_security
      uris: http://security.debian.org/debian-security
      suites:
        - "{{ ansible_facts['distribution_release'] }}-security"
      components:
        - main
        - contrib
      enabled: true
    - name: proxmox
      uris: http://download.proxmox.com/debian/pve
      suites:
        - "{{ ansible_facts['distribution_release'] }}"
      components:
        - pve-no-subscription
      enabled: true
    - name: pve-enterprise
      uris: https://enterprise.proxmox.com/debian/pve
      suites:
        - "{{ ansible_facts['distribution_release'] }}"
      components:
        - pve-enterprise
      enabled: false
    - name: ceph
      uris:
        - https://enterprise.proxmox.com/debian/ceph-quincy
        - https://enterprise.proxmox.com/debian/ceph-reef
      suites:
        - "{{ ansible_facts['distribution_release'] }}"
      components:
        - enterprise
        - no-subscription
      enabled: false
    - name: pvetest
      uris: http://download.proxmox.com/debian/pve
      suites:
        - "{{ ansible_facts['distribution_release'] }}"
      components:
        - pvetest
      enabled: false
    - name: legacy_debian
      uris: ftp.ca.debian.org/debian
      suites:
        - "{{ ansible_facts['distribution_release'] }}"
        - "{{ ansible_facts['distribution_release'] }}-updates"
      components:
        - main
        - contrib
      enabled: false
    - name: legacy_debian_security
      uris: security.debian.org
      suites:
        - "{{ ansible_facts['distribution_release'] }}-security"
      components:
        - main
        - contrib
      enabled: false

- name: Find legacy list sources
  find:
    paths:
      - /etc/apt
      - /etc/apt/sources.list.d
    patterns: "*.list"
  register: legacy_lists

- name: Delete legacy list sources
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ legacy_lists.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Disable free firmware warnings
  copy:
    src: apt.conf
    dest: /etc/apt/apt.conf.d/{{ proxmox_project }}-apt.conf

- name: Disable High Availability
  service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - pve-ha-lrm
    - pve-ha-crm
    - corosync

- name: Install packages
  apt:
    name:
      - lm-sensors
      - openssh-server
      - pip
      - virtualenv
    update_cache: true
    cache_valid_time: "{{ proxmox_apt_cache_valid_time }}"

- name: Upgrade packages
  apt:
    upgrade: dist

- name: Disable subscription warning
  replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: '(^\s*checked_command:\s*function\s*\(orig_cmd\)\s*\{\s*$)'
    replace: '\1 return orig_cmd();'
    backup: true

- name: Install python modules
  pip:
    name:
      - proxmoxer
      - requests
    virtualenv: "{{ proxmox_virtualenv }}"

- name: Create directory for VM images
  file:
    path: "{{ proxmox_image_directory }}/{{ proxmox_image_import_directory }}"
    state: directory

- name: Configure local storage
  template:
    src: storage.cfg.j2
    dest: /etc/pve/storage.cfg
    backup: true

- name: Enable the cluster firewall
  template:
    src: cluster.fw.j2
    dest: /etc/pve/firewall/cluster.fw
    backup: true

- name: Enable the node firewall
  copy:
    src: host.fw
    dest: /etc/pve/nodes/{{ inventory_hostname }}/host.fw
    backup: true

- name: Enable webauthn
  template:
    src: datacenter.cfg.j2
    dest: /etc/pve/datacenter.cfg
    backup: true
